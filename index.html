<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Builder</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body> 
    
    <nav class = "nav_bar">
        <div class = "logo">
            PC Builder
        </div> 
    </nav>

    <div class="main-cont">
        <aside class="PartPicker">
            <h3>Available Parts:</h3>
            <div>
                <section class="CPUs">
                    <button class="openBtn"><h4>+ CPU</h4></button>
                    <div  class="popup">
                        <div class="popup-content">
                            <div class="header-menu">
                                <button class="closeBtn">✕</button>
                                <h2>CPU</h2>
                            </div>   
                            <div class="filter-module"> 
                                <div class="filter-row">
                                    <div class="filter-dropdown">
                                        <button class="filter-pill dropdown-btn">Series</button>
                                        <div class="dropdown-content">
                                            <label class="dropdown-item"><input type="checkbox" value="Core Ultra 5" class="cpu-filter">Core Ultra 5</label>
                                            <label class="dropdown-item"><input type="checkbox" value="Core i5" class="cpu-filter">Core i5</label>
                                            <label class="dropdown-item"><input type="checkbox" value="Core i7" class="cpu-filter">Core i7</label>
                                            <label class="dropdown-item"><input type="checkbox" value="Ryzen 3" class="cpu-filter">Ryzen 3</label>
                                            <label class="dropdown-item"><input type="checkbox" value="Ryzen 5" class="cpu-filter">Ryzen 5</label>
                                            <label class="dropdown-item"><input type="checkbox" value="Ryzen 7" class="cpu-filter">Ryzen 7</label>
                                        </div>
                                    </div>
                                    <div class="filter-dropdown">
                                        <button class="filter-pill dropdown-btn">Socket</button>
                                        <div class="dropdown-content">
                                            <label class="dropdown-item"><input type="checkbox" value="AM4" class="cpu-filter">AM4</label>
                                            <label class="dropdown-item"><input type="checkbox" value="AM5" class="cpu-filter">AM5</label>
                                            <label class="dropdown-item"><input type="checkbox" value="LGA 1700" class="cpu-filter">LGA 1700</label>
                                            <label class="dropdown-item"><input type="checkbox" value="LGA 1851" class="cpu-filter">LGA 1851</label>
                                        </div>
                                    </div>
                                    <input type="text" class="filter-pill price-input" placeholder="Min Price">
                                    <input type="text" class="filter-pill price-input" placeholder="Max Price">
                                    <button class="clear-filterBtn">Clear</button>
                                </div>
                                <div class="search-row"> 
                                    <input type="text" class="search-bar" placeholder="Search for parts..."> 
                                    <div class="select-price-sorting">
                                        <button id="selected-text" class="select-button">Default ▼</button>
                                        <div class="options">
                                            <div class="option-item" data-value="default">Default</div>
                                            <div class="option-item" data-value="asc">Ascending</div>
                                            <div class="option-item" data-value="desc">Descending</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
                <section class="GPUs">
                    <button class="openBtn"><h4>+ GPU</h4></button>
                    <div class="popup">
                        <div class="popup-content">
                            <div class="header-menu">
                                <button class="closeBtn">✕</button>
                                <h2>GPU</h2>
                            </div> 
                        </div>
                    </div>
                </section>
                <section class="RAM">
                    <button class="openBtn"><h4>+ RAM</h4></button>
                    <div class="popup">
                        <div class="popup-content">
                            <div class="header-menu">
                                <button class="closeBtn">✕</button>
                                <h2>RAM</h2>
                            </div> 
                        </div>
                    </div>
                </section>
                <section class="Motherboard">
                    <button class="openBtn"><h4>+ Motherboard</h4></button>
                    <div class="popup">
                        <div class="popup-content">
                            <div class="header-menu">
                                <button class="closeBtn">✕</button>
                                <h2>Motherboard</h2>
                            </div> 
                        </div>
                    </div>
                </section>
                <section class="Storage">
                    <button class="openBtn"><h4>+ Storage</h4></button>
                    <div class="popup">
                        <div class="popup-content">
                            <div class="header-menu">
                                <button class="closeBtn">✕</button>
                                <h2>Storage</h2>
                            </div> 
                        </div>
                    </div>
                </section>
                <section class="PSU">
                    <button class="openBtn"><h4>+ PSU</h4></button>
                    <div class="popup">
                        <div class="popup-content">
                            <div class="header-menu">
                                <button class="closeBtn">✕</button>
                                <h2>PSU</h2>
                            </div> 
                        </div>
                    </div>
                </section>
                <section class="CPU-Cooler">
                    <button class="openBtn"><h4>+ CPU Cooler</h4></button>
                    <div class="popup">
                        <div class="popup-content">
                            <div class="header-menu">
                                <button class="closeBtn">✕</button>
                                <h2>CPU Cooler</h2>
                            </div> 
                        </div>
                    </div>
                </section>
                <section class="Case">
                    <button class="openBtn"><h4>+ Case</h4></button>
                    <div class="popup">
                        <div class="popup-content">
                            <div class="header-menu">
                                <button class="closeBtn">✕</button>
                                <h2>Case</h2>
                            </div> 
                        </div>
                    </div>
                </section>
            </div>
        </aside>
    <aside class="build-cart">
        <h3>Current Build</h3>
        
        <div class="cart-items">
            <p><strong>CPU:</strong> <span id = "choose-cpu">---</span></p>
            <p><strong>GPU:</strong> <span id = "choose-gpu">---</span></p>
            <p><strong>RAM:</strong> <span id = "choose-ram">---</span></p>
            <p><strong>Motherboard:</strong> <span id = "choose-motherboard">---</span></p>
            <p><strong>Storage:</strong> <span id = "choose-storage">---</span></p>
            <p><strong>PSU:</strong> <span id = "choose-psu">---</span></p>
            <p><strong>CPU Cooler:</strong> <span id = "choose-cpu-cooler">---</span></p>
            <p><strong>Case:</strong> <span id = "choose-case">---</span></p>
        </div>

        <h2 class="total-price">Total: $<span id = "total">0.00</span></h2>
    </aside>
    </div>
    <script src="script.js"></script>
</body>
</html>
