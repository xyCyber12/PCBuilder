<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Builder</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body> 
    
    <nav class = "nav_bar">
        <div class = "logo">
            PC Builder
        </div> 
    </nav>

    <div class="main-cont">
        <aside class="PartPicker">
            <h3>Available Parts:</h3>
            <div>
                <section class="CPUs">
                    <button class="openBtn"><h4>+ CPU</h4></button>
                    <div  class="popup">
                        <div class="popup-content">
                            <button class="closeBtn">✕</button>
                            <h2>CPU choices</h2>
                        </div>
                    </div>
                </section>
                <section class="GPUs">
                    <button class="openBtn"><h4>+ GPU</h4></button>
                    <div class="popup">
                        <div class="popup-content">
                            <button class="closeBtn">✕</button>
                            <h2>GPU choices</h2>
                        </div>
                    </div>
                </section>
                <section class="RAM">
                    <button class="openBtn"><h4>+ RAM</h4></button>
                    <div class="popup">
                        <div class="popup-content">
                            <button class="closeBtn">✕</button>
                            <h2>RAM choices</h2>
                        </div>
                    </div>
                </section>
                <section class="Motherboard">
                    <button class="openBtn"><h4>+ Motherboard</h4></button>
                    <div class="popup">
                        <div class="popup-content">
                            <button class="closeBtn">✕</button>
                            <h2>Motherboard choices</h2>
                        </div>
                    </div>
                </section>
                <section class="Storage">
                    <button class="openBtn"><h4>+ Storage</h4></button>
                    <div class="popup">
                        <div class="popup-content">
                            <button class="closeBtn">✕</button>
                            <h2>Storage choices</h2>
                        </div>
                    </div>
                </section>
                <section class="PSU">
                    <button class="openBtn"><h4>+ PSU</h4></button>
                    <div class="popup">
                        <div class="popup-content">
                            <button class="closeBtn">✕</button>
                            <h2>PSU choices</h2>
                        </div>
                    </div>
                </section>
                <section class="CPU-Cooler">
                    <button class="openBtn"><h4>+ CPU Cooler</h4></button>
                    <div class="popup">
                        <div class="popup-content">
                            <button class="closeBtn">✕</button>
                            <h2>CPU Cooler choices</h2>
                        </div>
                    </div>
                </section>
                <section class="Case">
                    <button class="openBtn"><h4>+ Case</h4></button>
                    <div class="popup">
                        <div class="popup-content">
                            <button class="closeBtn">✕</button>
                            <h2>Case choices</h2>
                        </div>
                    </div>
                </section>
            </div>
        </aside>
    <aside class="build-cart">
        <h3>Current Build</h3>
        
        <div class="cart-items">
            <p><strong>CPU:</strong> <span id = "choose-cpu">---</span></p>
            <p><strong>GPU:</strong> <span id = "choose-gpu">---</span></p>
            <p><strong>RAM:</strong> <span id = "choose-ram">---</span></p>
            <p><strong>Motherboard:</strong> <span id = "choose-motherboard">---</span></p>
            <p><strong>Storage:</strong> <span id = "choose-storage">---</span></p>
            <p><strong>PSU:</strong> <span id = "choose-psu">---</span></p>
            <p><strong>CPU Cooler:</strong> <span id = "choose-cpu-cooler">---</span></p>
            <p><strong>Case:</strong> <span id = "choose-case">---</span></p>
        </div>

        <h2 class="total-price">Total: $<span id = "total">0.00</span></h2>
    </aside>
    </div>
    <script src="script.js"></script>
</body>
</html>
